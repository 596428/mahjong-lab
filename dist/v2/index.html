<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>밤의 작탁 v2.7 — 손끝으로 바꾸는 역</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="help"><div class="dialog-head"><h2>작탁 안내</h2><button data-close="help">닫기</button></div><div id="help-content"></div></dialog>
<dialog id="settings"><div class="dialog-head"><h2>새 도전 설정</h2><button data-close="settings">닫기</button></div><p>새 도전을 시작하면 현재 진행을 교체합니다.</p><form id="new-run-form"><label>시드<input name="seed" id="seed-input" maxlength="80" placeholder="빈칸이면 무작위"></label><label>비공개 제외 장수<input name="excluded" type="number" min="0" max="18" value="6"></label><p>3챕터 × 2라운드 · 일반 → 무작위 보스<br>완성형 332 → 3332 → 33332</p><input type="hidden" name="rounds" value="2"><label>가격 모드<select name="priceMode"><option value="balanced">기본 경제 · 조정된 상품 가격</option><option value="feel">효과 체험 · 상품/팩/재진열 1냥, 판매 0냥</option></select></label><label class="check"><input type="checkbox" name="red">적도라 사용 · 종류별 5 한 장씩</label><button class="primary" type="submit">새 도전 시작</button></form></dialog>
<dialog id="practice"><div class="dialog-head"><h2>규칙 연습</h2><button data-close="practice">닫기</button></div><p>진행 중인 도전은 보존됩니다. 연습은 고정된 패로 시작합니다.</p><div class="practice-list"><button data-practice="boss-narrow">보스 · 좁은 창</button><button data-practice="boss-toll">보스 · 울기의 대가</button><button data-practice="boss-heavy">보스 · 무거운 작탁</button><button data-practice="shop">상점 · 도안 무한 구매</button><button data-practice="effects27">새 도안 6종 · 소매·은밀·보충</button><button data-practice="ron">론 · 치 선택</button><button data-practice="riichi">리치 · 일발</button><button data-practice="chase">리치 자동 추적 · 긴 대기</button><button data-practice="kan">대명깡</button><button data-practice="ankan">암깡</button><button data-practice="kakan">가깡</button><button data-practice="overlap">치또이츠 + 일반형 중첩</button></div></dialog>
<dialog id="catalog"><div class="dialog-head"><h2>상점 상품 목록 · v2.7</h2><button data-close="catalog">닫기</button></div><p>가격과 수치는 테스트용입니다. 속성 도안은 1냥·무제한 보유. 도안 자체 점수 보너스 없음. 규칙·득점 장비 5칸. 소모품 기본 2개. 강화는 이번 도전 안에서 유지됩니다.</p><div id="catalog-content"></div></dialog>
<script type="module" src="app.js"></script></body></html>
