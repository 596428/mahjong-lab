<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>패등야 — v4 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
:root{
  --gold:#d9b25f;--gold2:#f3d68f;--goldd:#8a6a2c;--ink:#f4ead5;--dim:#b7a98c;--dim2:#8f8370;
  --lac:#2a0f10;--lac2:#3b1415;--lac3:#541a1a;--felt:#1b4a3d;--felt2:#0f2b23;--blue:#5aa9e6;--red:#c62f24;
  --disp:'Black Han Sans','Noto Sans KR',sans-serif;--serif:'Noto Serif KR',serif;
}
html,body{margin:0;height:100%;background:#07080a;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.room{position:fixed;inset:0;background:
  radial-gradient(ellipse at 50% -10%,rgba(255,170,80,.18),transparent 55%),
  radial-gradient(ellipse at 10% 110%,rgba(160,30,30,.18),transparent 50%),
  radial-gradient(ellipse at 90% 110%,rgba(160,30,30,.18),transparent 50%),#07080a}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
input,select{font-family:inherit;background:#140808;color:var(--ink);border:1px solid var(--goldd);border-radius:8px;padding:6px 8px;font-size:14px}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;overflow:hidden;border-radius:18px;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(255,200,120,.10),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,rgba(0,0,0,.02) 2px 4px),
    radial-gradient(ellipse at 55% 45%,var(--felt),var(--felt2) 75%);
  box-shadow:0 0 0 10px #3a2212,0 0 0 12px #6b4423,0 0 0 13px #1a0e07,0 30px 80px rgba(0,0,0,.8),inset 0 0 120px rgba(0,0,0,.55)}
.stage-inner{position:absolute;inset:0}
.dimtext{color:var(--dim)}
.small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:linear-gradient(#2b1a10,#1c100a);border:1px solid var(--goldd);border-radius:10px;padding:8px 14px;min-height:40px;font-size:14px;color:var(--ink);transition:transform .1s,box-shadow .15s}
button:not(:disabled):hover{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(217,178,95,.35)}
button:not(:disabled):active{transform:translateY(1px)}
.primary{background:linear-gradient(#c13a2c,#7c1912);color:#ffeec4;border:1px solid var(--gold2);border-radius:12px;font-weight:700;padding:10px 22px;min-height:46px;font-size:17px;
  box-shadow:inset 0 1px 0 rgba(255,220,170,.35),0 4px 0 #4a0d09,0 8px 18px rgba(0,0,0,.4);font-family:var(--disp);letter-spacing:.5px}
.primary.big{font-size:24px;padding:14px 44px}
.ghost{background:transparent}

/* ---------- tiles ---------- */
.tile{position:relative;display:inline-block;flex:none;padding:0;border:none;border-radius:7px;
  background:linear-gradient(160deg,#fffaf0 0%,#f3ead6 60%,#e6dbc2 100%);
  box-shadow:0 0 0 1px #cbbd9c inset,0 3px 0 #d8ccb0,0 6px 0 #1f6b54,0 7px 0 #134536,0 10px 14px rgba(0,0,0,.45);
  transition:transform .14s ease,box-shadow .14s,filter .14s}
.tile .body{position:absolute;inset:6% 7%;display:block}
.tile .face{width:100%;height:100%;display:block}
.tile .idx{position:absolute;top:2px;left:4px;font:700 11px var(--disp);color:#6d6250;line-height:1}
.tile.red .idx{color:var(--red)}
.tile .reddot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 4px rgba(198,47,36,.8)}
.tile-xs{width:24px;height:33px;border-radius:4px;box-shadow:0 0 0 1px #cbbd9c inset,0 2px 0 #1f6b54,0 3px 5px rgba(0,0,0,.4)}
.tile-xs .idx{display:none}.tile-xs .body{inset:4% 6%}
.tile-sm{width:36px;height:50px;border-radius:5px;box-shadow:0 0 0 1px #cbbd9c inset,0 2px 0 #d8ccb0,0 4px 0 #1f6b54,0 6px 8px rgba(0,0,0,.4)}
.tile-sm .idx{font-size:9px;top:1px;left:3px}
.tile-md{width:58px;height:80px}
.tile-md .idx{font-size:12px}
.tile-lg{width:90px;height:124px;border-radius:11px;box-shadow:0 0 0 1px #cbbd9c inset,0 4px 0 #d8ccb0,0 9px 0 #1f6b54,0 11px 0 #134536,0 16px 22px rgba(0,0,0,.5)}
.tile-lg .idx{font-size:15px;top:4px;left:7px}
.tile.click{cursor:pointer}
.tile.click:hover{transform:translateY(-6px)}
.tile.sel{transform:translateY(-18px);box-shadow:0 0 0 1px #cbbd9c inset,0 0 0 3px var(--gold2),0 0 22px rgba(243,214,143,.6),0 6px 0 #1f6b54,0 14px 18px rgba(0,0,0,.45)}
.tile.dim{filter:brightness(.45) saturate(.4)}
.tile.drawn{margin-left:18px}
.tile .badge{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#f6d98e,#c99a3d);color:#3a1a05;
  font:400 15px var(--disp);padding:4px 12px;border-radius:999px;box-shadow:0 0 16px rgba(243,214,143,.7);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px rgba(243,214,143,1)}}
.tile .effdot{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.tile .mark{position:absolute;bottom:2px;right:2px;font-size:10px}
.tile.callable{box-shadow:0 0 0 1px #cbbd9c inset,0 0 0 3px var(--blue),0 0 16px rgba(90,169,230,.8),0 4px 0 #1f6b54;cursor:pointer;animation:callglow 1.2s ease-in-out infinite}
@keyframes callglow{50%{box-shadow:0 0 0 1px #cbbd9c inset,0 0 0 3px var(--blue),0 0 26px rgba(90,169,230,1),0 4px 0 #1f6b54}}
.tile.eaten{filter:brightness(.25) sepia(.6)}
.tile.fromhand{filter:brightness(.82) sepia(.15)}
.C2 .tile{animation:deal .38s cubic-bezier(.2,.9,.3,1.2) both}
.C2 .tile:nth-child(2){animation-delay:.07s}.C2 .tile:nth-child(3){animation-delay:.14s}.C2 .tile:nth-child(4){animation-delay:.21s}
@keyframes deal{from{transform:translateY(-60px) rotateX(70deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- L panel (lacquer) ---------- */
.L{position:absolute;left:18px;top:18px;width:206px;height:684px;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(180deg,var(--lac2),var(--lac));border:1px solid var(--goldd);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),inset 0 0 0 5px rgba(217,178,95,.35),0 10px 30px rgba(0,0,0,.5)}
.L .cr{display:flex;flex-direction:column;gap:2px}
.L .cr small{color:var(--dim);font-size:13px;letter-spacing:1px}
.L .cr b{font:400 30px var(--disp);color:var(--gold2);text-shadow:0 2px 0 #000,0 0 14px rgba(243,214,143,.35)}
.boss{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-height:150px}
.boss.empty{min-height:150px;background:radial-gradient(circle at 50% 40%,rgba(217,178,95,.08),transparent 60%)}
.portrait{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 40px var(--serif);color:#ffe2a6;
  background:radial-gradient(circle at 40% 35%,#8e2a2a,#2a0b0b 70%);border:3px solid var(--gold);box-shadow:0 0 0 3px #1a0606,0 0 24px rgba(198,47,36,.55);text-shadow:0 0 12px rgba(255,190,100,.6)}
.portrait.big{width:120px;height:120px;font-size:62px}
.bname{font:400 18px var(--disp);color:var(--ink)}.bname.big{font-size:28px}
.mechs{display:flex;flex-wrap:wrap;gap:6px}.mechs.center{justify-content:center;max-width:520px}
.mech{font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid #5a4a3a;background:rgba(0,0,0,.35)}
.mech.sym{border-color:var(--gold);color:var(--gold2);background:rgba(90,40,10,.4)}
.mech.warn{border-color:#d2443a;color:#f2a39b}
.sealed{display:flex;gap:4px}
.gauge .nums{display:flex;align-items:baseline;gap:6px}.gauge b{font:400 36px var(--disp);color:#fff;text-shadow:0 2px 0 #000}.gauge span{color:var(--dim);font-size:16px}
.gauge .bar{height:10px;border-radius:5px;background:#120606;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 3px #000}
.gauge .bar>div{height:10px;background:linear-gradient(90deg,#3c7fc4,var(--blue));transition:width .6s}.gauge .bar>div.full{background:linear-gradient(90deg,#c99a3d,var(--gold2));box-shadow:0 0 12px var(--gold2)}
.stats{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.subs{display:flex;gap:8px}.subs span{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.4)}
.subs span.on{background:radial-gradient(circle at 40% 35%,#ffe9a8,#c99a3d);box-shadow:0 0 8px rgba(243,214,143,.6)}
.wallc{font:400 24px var(--disp);display:flex;align-items:center;gap:8px}.wallc .ic{color:var(--dim)}
.money{font:400 30px var(--disp);color:var(--gold2);text-shadow:0 2px 0 #000}.money.big{font-size:40px}

/* ---------- T row ---------- */
.T{position:absolute;left:244px;top:18px;right:100px;height:64px;display:flex;gap:18px}
.slots{display:flex;gap:8px}
.slot{width:58px;height:58px;border-radius:12px;border:1px dashed rgba(217,178,95,.35);background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font:400 14px var(--disp);padding:0;min-height:0}
.slot.full{border:1px solid var(--gold);background:radial-gradient(circle at 50% 35%,#5a2a10,#2a1208);color:var(--gold2);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.slot.g.full{border-color:#b895f0;background:radial-gradient(circle at 50% 35%,#3a2460,#1a1030);color:#dccbff}
.slot.t.full{border-color:var(--blue);background:radial-gradient(circle at 50% 35%,#163a58,#0a1a2a);color:#bfe1fa}
.slot.on{box-shadow:0 0 0 3px var(--gold2)}

/* ---------- river ---------- */
.C1{position:absolute;left:244px;top:96px;width:916px;height:138px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:12px 14px;
  background:rgba(5,20,15,.45);border:1px solid rgba(217,178,95,.25);border-radius:14px;box-shadow:inset 0 2px 12px rgba(0,0,0,.5)}
.C1::before{content:'버림패';position:absolute;right:12px;bottom:8px;font:400 13px var(--disp);color:rgba(217,178,95,.35);letter-spacing:2px}
.callpop{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:30;background:linear-gradient(#1c2b3e,#0d1724);border:1px solid var(--blue);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:320px;box-shadow:0 0 30px rgba(90,169,230,.35),0 14px 30px rgba(0,0,0,.6);animation:pop .2s}
.callpop .opts{display:flex;gap:6px;justify-content:center}.callpop .opts button{display:flex;gap:2px;padding:4px}.callpop .opts button.on{border-color:var(--gold2)}
.meldrow{display:flex;gap:4px;justify-content:center}
.chain{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px;background:rgba(0,0,0,.35);border-radius:10px}
.chain .arr{color:#7cc0f0}.chain .x{color:var(--gold2);font-weight:700}
.pips{display:flex;gap:4px}.pips i{width:13px;height:13px;border-radius:50%}.pips i.on{background:radial-gradient(circle at 40% 35%,#ffe9a8,#c99a3d)}.pips i.lost{border:2px dashed var(--gold);opacity:.7}
.prog{text-align:center;font:400 17px var(--disp)}.prog.up{color:#7fd39a}.prog.down{color:#f0b46a}
.warnline{font-size:13px;padding:6px 10px;border-radius:8px;background:rgba(90,40,10,.5);border:1px solid var(--goldd);color:var(--gold2);text-align:center}
.callpop .row{justify-content:center}

/* ---------- offer ---------- */
.C2{position:absolute;left:244px;top:252px;width:916px;height:176px;display:flex;align-items:center;justify-content:center;gap:38px;perspective:600px}
.C2::before{content:'';position:absolute;left:50%;top:50%;width:520px;height:150px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,210,140,.14),transparent 70%);pointer-events:none}
.prep{color:var(--dim)}

/* ---------- hand bar ---------- */
.Hbar{position:absolute;left:244px;top:448px;width:916px;height:56px;display:flex;align-items:center;gap:16px}
.lamp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lamp span{width:20px;height:24px;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 50% 40%,#fff1b8,#f0a83a 60%,#b0521a);box-shadow:0 0 16px 6px rgba(240,168,58,.55);animation:flame 2.4s ease-in-out infinite}
.lamp.off span{background:#2a2420;box-shadow:none;border:1px solid #5a4a3a;animation:none}
.lamp.sm span{width:13px;height:16px}
.lamp.warn span{animation:flick .9s ease-in-out infinite}
@keyframes flame{50%{box-shadow:0 0 22px 9px rgba(240,168,58,.7);transform:scale(1.04)}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.25}}
.riichi-on{padding:5px 12px;border-radius:8px;border:1px solid var(--gold);color:var(--gold2);font:400 15px var(--disp);background:rgba(90,40,10,.5);box-shadow:0 0 12px rgba(217,178,95,.4)}
.waits{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(217,178,95,.35)}
.waits .pre{font-size:12px;color:var(--dim)}.waits .w{display:flex;align-items:center;gap:3px}.waits b{font:400 16px var(--disp);color:var(--gold2)}
.abtns{margin-left:auto;display:flex;gap:10px}
.abtn{min-width:84px;min-height:48px;font:400 18px var(--disp);border-radius:12px;letter-spacing:.5px;animation:pop .18s}
.abtn.win{background:linear-gradient(#f6d98e,#c4912f);color:#3a1a05;border:1px solid #fff1c4;box-shadow:0 0 20px rgba(243,214,143,.7),0 4px 0 #6a4510}
.abtn.riichi{background:linear-gradient(#c13a2c,#7c1912);border-color:var(--gold2);color:#ffeec4;box-shadow:0 4px 0 #4a0d09}

/* ---------- hand ---------- */
.H{position:absolute;left:244px;top:530px;width:760px;height:130px;display:flex;align-items:flex-end;gap:5px;padding-bottom:18px}
.H.locked .tile:not(.drawn){filter:brightness(.8)}
.M{position:absolute;left:1010px;top:530px;width:150px;height:170px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.meld{display:flex;gap:2px}

/* ---------- R rail ---------- */
.R{position:absolute;right:18px;top:96px;width:66px;display:flex;flex-direction:column;gap:10px}
.rail{position:relative;width:66px;height:58px;border-radius:12px;font:400 17px var(--disp);padding:0}
.rail.on{border-color:var(--gold2);box-shadow:0 0 12px rgba(243,214,143,.5)}
.rail .pip{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.shopR{top:96px}

/* ---------- panels ---------- */
.panel-wrap{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.panel{position:absolute;right:100px;top:96px;width:350px;max-height:600px;overflow:auto;z-index:35;padding:18px;border-radius:16px;
  background:linear-gradient(180deg,#26100f,#150808);border:1px solid var(--gold);box-shadow:inset 0 0 0 4px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.6);animation:pop .18s}
.panel-wrap .panel{position:relative;right:auto;top:auto}
.panel.wide{width:640px}
.panel h3{margin:0 0 12px;font:400 22px var(--disp);color:var(--gold2)}
.ylist,.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ylist li{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 8px;border-radius:6px}
.ylist li i{width:10px;height:10px;border-radius:50%;background:#55504a}
.ylist li.ok{background:rgba(217,178,95,.12)}.ylist li.ok i{background:var(--gold2);box-shadow:0 0 6px var(--gold2)}.ylist li.may i{background:var(--blue)}.ylist li.no{color:#7d7366}
.ylist li span{margin-left:auto;color:var(--dim);font-size:12px}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.plist li{display:flex;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid rgba(217,178,95,.15)}
.plist li b{margin-left:auto;color:var(--gold2);font-weight:600}.plist li em{color:#7fd39a;font-style:normal;font-size:12px}
.plist li.zero{color:#f2a39b;text-decoration:line-through}
.wallgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:8px 0}
.wg{display:flex;align-items:center;gap:6px;padding:5px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(217,178,95,.2);min-height:0}
.wg b{font-size:14px}.wg span{font-size:12px;color:var(--dim)}
.tg{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.tg input{width:18px;height:18px;accent-color:#c99a3d}
.dev{width:580px}.devgrid{display:flex;flex-direction:column;gap:10px}.devgrid label{display:flex;gap:10px;align-items:center;font-size:14px}
.vars{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(4,3,3,.74);backdrop-filter:blur(2px)}
.overlay.solid{background:radial-gradient(ellipse at 50% 30%,rgba(120,40,20,.35),transparent 60%),rgba(6,5,5,.92)}
.overlay.center{display:flex;align-items:center;justify-content:center}
.card{border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;align-items:center;min-width:380px;
  background:linear-gradient(180deg,#2b1210,#170908);border:1px solid var(--gold);box-shadow:inset 0 0 0 5px rgba(0,0,0,.3),inset 0 0 0 6px rgba(217,178,95,.25),0 24px 60px rgba(0,0,0,.7);animation:pop .22s}
.card h2{margin:0;font:400 32px var(--disp);color:var(--gold2);text-shadow:0 2px 0 #000}
.endcard .big{font:400 54px var(--disp);margin:0}.endcard .big span{font-size:22px;color:var(--dim)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.banner{cursor:pointer;background:radial-gradient(ellipse at 50% 45%,rgba(120,30,20,.35),rgba(3,3,3,.8) 70%)}
.bancard{display:flex;flex-direction:column;align-items:center;gap:10px;animation:bannerin .5s cubic-bezier(.2,.9,.3,1.1)}
.bancard small{font:400 18px var(--disp);color:var(--dim);letter-spacing:4px}
.bancard h2{margin:0;font:400 64px var(--disp);color:var(--gold2);text-shadow:0 4px 0 #000,0 0 30px rgba(243,214,143,.45)}
.bancard.boss h2{color:#ff9d7a}
.bancard .quote{margin:0;font:700 18px var(--serif);color:var(--ink)}
.bancard .target{display:flex;align-items:baseline;gap:10px;margin-top:6px}.bancard .target span{color:var(--dim)}.bancard .target b{font:400 40px var(--disp)}
@keyframes bannerin{from{transform:translateY(20px) scale(.95);opacity:0;letter-spacing:12px}to{transform:none;opacity:1}}

/* settlement */
.settle{min-width:660px;cursor:pointer}
.groups{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.grp{display:flex;gap:3px}
.yaku-lines{display:flex;flex-direction:column;gap:5px;min-height:40px;width:100%}
.yl{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-radius:8px;background:rgba(0,0,0,.35);border-left:3px solid var(--gold);animation:slide .3s cubic-bezier(.2,.9,.3,1.2)}
.yl span{font:400 18px var(--disp)}
.yl b{font:400 20px var(--disp);color:#ff8f6a}.yl.yakuman{background:rgba(120,30,10,.5);border-color:#ff8f6a}.yl.mult{border-color:#b895f0}.yl.mult b{color:#dccbff}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.bm{display:flex;align-items:center;gap:16px}
.bm>div{display:flex;flex-direction:column;align-items:center;min-width:170px;padding:10px 18px;border-radius:14px}
.bm small{color:#e8dcc4;font-size:13px}.bm span{font:400 44px var(--disp);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.bm .b{background:linear-gradient(#2d6fb5,#163f6e);box-shadow:0 0 22px rgba(90,169,230,.35)}
.bm .m{background:linear-gradient(#c13a2c,#6e1510);box-shadow:0 0 22px rgba(198,47,36,.45)}
.bm .x{font:400 36px var(--disp);color:var(--gold2)}
.flash{height:24px;color:var(--gold2);font:400 18px var(--disp)}
.total{font:400 72px var(--disp);color:var(--gold2);text-shadow:0 4px 0 #000,0 0 30px rgba(243,214,143,.6);animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.formula{font-size:11px;background:rgba(0,0,0,.4);padding:8px;border-radius:8px;max-height:160px;overflow:auto;align-self:stretch}
.decs{display:flex;flex-direction:column;gap:10px}
.dec{display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px}
.ynames{font-size:13px;color:var(--dim)}
.cash ul{list-style:none;padding:0;margin:0;min-width:320px}
.cash li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(217,178,95,.2);animation:slide .25s}
.cash li b{color:var(--gold2);font:400 18px var(--disp)}.cash .sum{font:400 44px var(--disp);color:var(--gold2)}

/* ---------- shop ---------- */
.shop{position:absolute;inset:0}
.keeper{margin:0;font:700 14px var(--serif);color:var(--ink);line-height:1.5}
.nextinfo{display:flex;flex-direction:column}.nextinfo small{color:var(--dim)}.nextinfo b{font:400 30px var(--disp)}
.shelf{position:absolute;left:244px;top:140px;width:916px;display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.item{position:relative;width:162px;min-width:0;height:226px;padding:16px 12px;justify-content:space-between;cursor:pointer;border-radius:10px;
  background:linear-gradient(180deg,#f3e6c6,#e2cf9f);color:#2a1a0c;border:none;box-shadow:0 0 0 1px #8a6a2c,0 6px 0 #6b4a1c,0 14px 24px rgba(0,0,0,.5);animation:none}
.item:not(:disabled):hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 0 2px var(--gold2),0 6px 0 #6b4a1c,0 18px 28px rgba(0,0,0,.55)}
.item::before{content:'';position:absolute;inset:8px;border:1px solid rgba(122,40,20,.35);border-radius:6px;pointer-events:none}
.item .kind{font:400 13px var(--disp);color:#fff;background:#9b2a1e;padding:3px 10px;border-radius:4px}
.item.relic .kind{background:#8a5a12}.item.gambit .kind{background:#5a3a8a}.item.tool .kind{background:#1f5a8a}.item.ticket .kind{background:#2f6b3c}.item.craft .kind{background:#9b4a1e}
.item .nm{font:900 22px var(--serif);text-align:center;line-height:1.25}
.item .price{font:400 22px var(--disp);color:#fff;background:radial-gradient(circle at 40% 35%,#d24a3a,#8a1a12);width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #f3d68f,0 3px 6px rgba(0,0,0,.4)}
.item.sold{opacity:.22;transform:none}
.shop .shelf .item:disabled{opacity:.5}
.shopbtns{position:absolute;left:244px;bottom:28px;width:916px;display:flex;justify-content:center;gap:18px}
.shopbtns button{min-width:180px;min-height:56px;font:400 19px var(--disp)}
.sellbar{position:absolute;left:244px;top:90px;display:flex;align-items:center;gap:12px}

/* ---------- title ---------- */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 20%,rgba(255,150,60,.18),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.6),transparent 60%)}
.lanterns{position:absolute;top:0;left:0;right:0;height:200px;pointer-events:none}
.lantern{position:absolute;top:0;width:2px;background:#3a2a1a;transform-origin:top center;animation:sway 4s ease-in-out infinite}
.lantern i{position:absolute;left:50%;bottom:-62px;width:52px;height:66px;transform:translateX(-50%);border-radius:45%;
  background:radial-gradient(circle at 50% 45%,#ffd38a,#e2482f 45%,#7a160f 85%);box-shadow:0 0 40px 10px rgba(226,72,47,.45),0 0 90px 30px rgba(255,170,80,.18)}
.lantern i::before,.lantern i::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:24px;height:6px;background:#2a1a0e;border-radius:2px}
.lantern i::before{top:-3px}.lantern i::after{bottom:-3px}
.lantern.l0{left:9%;height:60px;animation-delay:-1s}.lantern.l1{left:26%;height:100px;animation-delay:-2.2s}.lantern.l2{left:50%;height:40px;animation-delay:-.4s}
.lantern.l3{left:74%;height:96px;animation-delay:-3s}.lantern.l4{left:91%;height:56px;animation-delay:-1.6s}
@keyframes sway{50%{transform:rotate(3deg)}}
.logo{display:flex;flex-direction:column;align-items:center;margin-top:60px}
.logo .hanja{font:900 30px var(--serif);color:var(--gold);letter-spacing:18px;margin-left:18px;opacity:.85}
.logo h1{margin:0;font:400 120px var(--disp);color:var(--gold2);letter-spacing:10px;text-shadow:0 6px 0 #3a0c06,0 0 40px rgba(255,170,80,.5),0 0 2px #000}
.logo .sub{margin:0;font:700 18px var(--serif);color:var(--ink);letter-spacing:2px}
.intro{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 10px}
.intro p{margin:0;font:500 15px 'Noto Sans KR';color:var(--dim);opacity:0;animation:fadein .8s forwards}
@keyframes fadein{to{opacity:1}}
.title .opts{color:var(--dim);font-size:13px}
.howto{max-width:700px;color:var(--dim);font-size:14px}.howto summary{cursor:pointer;text-align:center;color:var(--gold)}

/* ---------- tooltip ---------- */
.tooltip{position:fixed;z-index:100;transform:translate(-50%,-100%);background:linear-gradient(#2b1210,#170908);color:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:7px 11px;font-size:13px;white-space:pre-line;max-width:340px;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.tooltip.below{transform:translate(-50%,0)}
.rotate-hint{position:fixed;left:12px;right:12px;bottom:16px;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(#2b1210,#170908);border:1px solid var(--gold);color:var(--gold2);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.rotate-hint p{margin:0}.rotate-hint .primary{font-size:14px;min-height:40px;padding:6px 14px}
.portrait.dimmed{filter:grayscale(.7) brightness(.55);box-shadow:0 0 0 3px #1a0606}
.boss.empty .bname{font-size:15px}
.slot.full{font:700 11px 'Noto Sans KR';line-height:1.15;padding:3px;text-align:center;word-break:keep-all}
.rotate-hint .row{flex-wrap:nowrap}.rotate-hint .ghost{font-size:14px;min-height:40px;padding:6px 12px}
.rotate-hint button{white-space:nowrap}
.cstat{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:10px 14px;background:rgba(0,0,0,.35);border-radius:10px;font-size:15px;align-items:baseline}
.cstat dt{color:#9fb6cc;font-size:13px}.cstat dd{margin:0;color:#eef3f8}.cstat b{font:400 18px var(--disp);color:#fff}
.cstat .good{color:#7fd39a}.cstat .bad{color:#f0b46a}.cstat .note{margin-left:8px;font-size:12px;color:#9fb6cc}.cstat .note.bad{color:#f0b46a}
